org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Required for Room + KSP with AGP built-in Kotlin.
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The exported-app shell (export/shell): placeholders Whittle replaces in its manifest when it packages an app.
# Both the shell build and Whittle read these, so they always match.
whittle.exportShell.packagePlaceholder=app.whittle.exported.placeholder
whittle.exportShell.labelPlaceholder=WhittleExportedAppLabelPlaceholder
