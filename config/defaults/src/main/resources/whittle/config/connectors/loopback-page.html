<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
         gap: 24px; padding: 24px; box-sizing: border-box; background: #111; color: #eee; }
  h1 { font-size: 28px; margin: 0; }
  p { font-size: 17px; line-height: 1.5; margin: 0; color: #bbb; }
  a { display: block; text-align: center; padding: 16px; border-radius: 999px; background: #eee; color: #111;
      text-decoration: none; font-size: 17px; }
</style>
</head>
<body>
<h1>{{title}}</h1>
<p>{{message}}</p>
<a href="{{link}}">{{button}}</a>
</body>
</html>
