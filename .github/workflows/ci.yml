# Runs what CONTRIBUTING.md asks before review: every test, release lint and a debug build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The NDK version the build pins (gradle/libs.versions.toml), installed up front so a missing licence
      # or download fails here, not halfway through the build.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null

      # Termux runtime downloads are pinned by termux-runtimes.lock.json, so the lock file keys the cache.
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/whittle-termux
          key: termux-${{ hashFiles('app/termux-runtimes.lock.json') }}

      - name: Test, lint and build
        run: ./gradlew test :app:lintRelease :app:assembleDebug

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
