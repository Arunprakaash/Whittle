# Runs what CONTRIBUTING.md asks before review: every test, release lint and a debug build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Write only for the mirror step, which runs on pushes to main; pull requests from forks get read-only tokens anyway.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The NDK version the build pins (gradle/libs.versions.toml), installed up front so a missing licence
      # or download fails here, not halfway through the build.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null

      # Termux runtime downloads are pinned by termux-runtimes.lock.json, so the lock file keys the cache.
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/whittle-termux
          key: termux-${{ hashFiles('app/termux-runtimes.lock.json') }}

      - name: Test, lint and build
        run: ./gradlew test :app:lintRelease :app:assembleDebug

      # Termux keeps only each package's current version, so a pinned one can vanish (5.1.107.98 did) and break
      # every fresh build. From main, the pinned .debs go to the termux-runtimes release, the mirror the build
      # falls back to (termux-runtimes.json); uploads replace files of the same name, and old versions stay.
      - name: Mirror the pinned Termux packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :app:collectTermuxDebs
          gh release view termux-runtimes > /dev/null 2>&1 || gh release create termux-runtimes --title "Termux runtimes (build mirror)" --notes "The Termux packages app/termux-runtimes.lock.json pins, kept for builds after Termux drops them. Not a Whittle release." --latest=false
          gh release upload termux-runtimes app/build/termux-mirror/*.deb --clobber

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
