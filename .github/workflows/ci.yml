# Runs what CONTRIBUTING.md asks before review: every test, release lint and a debug build, and the Mac app's .dmg.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only for every job; only the mirror job asks for more, and it runs no build code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      mirror-release: ${{ steps.mirror-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The NDK version the build pins (gradle/libs.versions.toml), installed up front so a missing licence
      # or download fails here, not halfway through the build.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null

      # Termux runtime downloads are pinned by termux-runtimes.lock.json, so the lock file keys the cache.
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/whittle-termux
          key: termux-${{ hashFiles('app/termux-runtimes.lock.json') }}

      - name: Test, lint and build
        run: ./gradlew test :app:lintRelease :app:assembleDebug

      # Termux keeps only each package's current version, so a pinned one can vanish (5.1.107.98 did) and break
      # every fresh build. On main the pinned .debs are collected here, with this job's read-only token, and the
      # mirror job below publishes them.
      - name: Collect the pinned Termux packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :app:collectTermuxDebs

      - name: Hand the packages to the mirror job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: termux-debs
          path: app/build/termux-mirror/*.deb
          if-no-files-found: error
          retention-days: 1

      # Each lock file gets a release of its own, named by termux-runtimes.json's mirror with {lock} as the lock
      # file's id (Lockfile.id: the first 12 hex digits of its SHA-256), so the name comes from where builds look.
      - name: Name the mirror release
        id: mirror-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          id=$(sha256sum app/termux-runtimes.lock.json | cut -c1-12)
          releases="https://github.com/$GITHUB_REPOSITORY/releases/download/"
          tag=$(jq -r --arg id "$id" --arg releases "$releases" \
            '.mirrors[] | select(startswith($releases)) | split("{lock}") | join($id) | ltrimstr($releases) | rtrimstr("/")' \
            app/termux-runtimes.json)
          if [ "$(wc -l <<< "$tag")" -ne 1 ] || [ -z "$tag" ] || [[ "$tag" == */* ]] || [[ "$tag" != *"$id"* ]]; then
            echo "::error::termux-runtimes.json needs one mirror of the form $releases<name with {lock}>/"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  # The Mac app, packaged as the release .dmg for Apple silicon. It's unsigned here (signing needs the Developer ID
  # certificate, which stays on the machine that makes releases); the .dmg is kept so a change can be tried on a Mac.
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on 21; the app is packaged with 25's jpackage, since 21's won't take a version that starts at 0.
      - id: package-jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Package
        run: ./gradlew :companion:releaseDmg -Pwhittle.packageJdk="${{ steps.package-jdk.outputs.path }}"

      - name: Show jpackage's logs
        if: failure()
        run: cat companion/build/compose/logs/*/*.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  # Puts the pinned .debs on the lock file's mirror release, which the build falls back to (termux-runtimes.json).
  # The only job with a write token. It runs no Gradle and no repository code: it uploads what the build job
  # handed over, and every .deb is checked against its pinned SHA-256 again when a build downloads it.
  mirror:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: ${{ needs.build.outputs.mirror-release }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: termux-debs
          path: debs

      # The repository's releases are immutable: once published, a release takes no new assets. So the release is
      # made as a draft, filled, checked and only then published; a run stopped halfway leaves a draft the next one
      # finishes. Names include the version and the bytes are pinned, so a file the draft already has is never
      # uploaded again (no --clobber, which deletes the old asset first). It's a prerelease so the landing page, which
      # lists only full releases, doesn't show it.
      - name: Publish the mirror release
        run: |
          set -euo pipefail
          errors=$(mktemp)
          if ! release=$(gh release view "$RELEASE" --json isDraft,assets 2> "$errors"); then
            # Only a missing release is created; an auth or network error stops here with its own message.
            grep -qi 'release not found' "$errors" || { cat "$errors" >&2; exit 1; }
            gh release create "$RELEASE" --draft --prerelease --target "$GITHUB_SHA" --title "Termux runtimes $RELEASE (build mirror)" --notes "The Termux packages app/termux-runtimes.lock.json pins (this release is named after that file's SHA-256), kept for builds after Termux drops them. Not a Whittle release."
            release=$(gh release view "$RELEASE" --json isDraft,assets)
          fi
          draft=$(jq -r .isDraft <<< "$release")
          if [ "$draft" = true ]; then
            existing=$(jq -r '.assets[].name' <<< "$release")
            missing=()
            for deb in debs/*.deb; do
              grep -qxF "$(basename "$deb")" <<< "$existing" || missing+=("$deb")
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              gh release upload "$RELEASE" "${missing[@]}"
            fi
          fi
          # GitHub renames assets whose names have some special characters (a version with ~ or +), and builds look
          # a package up on the mirror by its Termux file name, so check every name is there as it was uploaded.
          uploaded=$(gh release view "$RELEASE" --json assets --jq '.assets[].name')
          for deb in debs/*.deb; do
            if ! grep -qxF "$(basename "$deb")" <<< "$uploaded"; then
              if [ "$draft" = true ]; then
                echo "::error::The draft $RELEASE has no asset named $(basename "$deb"); GitHub may have renamed it"
              else
                echo "::error::The published $RELEASE lacks $(basename "$deb") and can't take new assets; delete the release and rerun this job"
              fi
              exit 1
            fi
          done
          if [ "$draft" = true ]; then
            gh release edit "$RELEASE" --draft=false
          fi
